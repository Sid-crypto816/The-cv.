<!DOCTYPE html>
<html>

<head>
    <title>My Projects</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)),
                url("bleach-thousand-3840x2160-19704.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .page {
            width: 90%;
            max-width: 800px;
            min-height: 350px;
            box-sizing: border-box;
            padding: 60px 40px;
            margin: 40px 0;
            border-radius: 12px;
            color: white;
            background:
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
                url("ichigo-kurosaki-3840x2160-27177.jpg");
            background-size: cover;
            background-position: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* video sabke upar + dim */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 9999;
            opacity: 0.40;
            pointer-events: none;
        }

        /* orange buttons */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 6px;
            background: #ff7a00;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #ff7a00;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: transparent;
            color: #ff7a00;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 122, 0, 0.9);
        }

        /* music on/off button (corner) */
        .music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #ff7a00;
            background: #ff7a00;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: transparent;
            color: #ff7a00;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 122, 0, 0.6);
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 18px 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 10000;
        }

        .navbar a {
            color: #e65c00;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .navbar a:hover,
        .navbar a.active {
            color: #ff7a00;
            border-bottom: 2px solid #ff7a00;
        }

        /* projects page */
        #projects {
            text-align: center;
        }

        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            border: 2px solid white;
            border-radius: 10px;
            padding: 20px;
            width: 200px;
            background: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html" class="active">Projects</a>
        <a href="cv.html">CV</a>
    </nav>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="Video_Project.mp4" type="video/mp4">
    </video>

    <audio id="bgMusic" loop>
        <source src="bleach-pv-ost-shiro-sagisu-hazel-fernandes-number-one-2022-ver-extended.mp3" type="audio/mpeg">
    </audio>

    <button id="musicBtn" class="music-btn">🔇</button>

    <section id="projects" class="page">
        <h2>My Projects</h2>
        <p>Projects I build will show up here.</p>

        <div class="card-container">

            <div class="card">
                <h3>Project Name</h3>
                <p>Coming Soon...</p>
                <a class="btn" href="#">View Project</a>
            </div>

            <div class="card">
                <h3>Project Name</h3>
                <p>Coming Soon...</p>
                <a class="btn" href="#">View Project</a>
            </div>

            <div class="card">
                <h3>Project Name</h3>
                <p>Coming Soon...</p>
                <a class="btn" href="#">View Project</a>
            </div>

        </div>
    </section>

    <script>
        const music = document.getElementById("bgMusic");
        const btn = document.getElementById("musicBtn");

        btn.addEventListener("click", function () {
            if (music.paused) {
                music.play();
                btn.textContent = "🔊";
            } else {
                music.pause();
                btn.textContent = "🔇";
            }
        });
    </script>

</body>

</html>
